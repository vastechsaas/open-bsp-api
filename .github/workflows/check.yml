name: Check

on:
  push:
    branches: [main, develop, meta_vista_backend]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/voice-transcoding-service/package-lock.json
      - run: deno fmt --check
      - run: cd supabase/functions && deno lint && deno check .
      - run: cd plugin && deno lint && deno check .
      - run: npm ci
        working-directory: services/voice-transcoding-service
      - run: npm run validate
        working-directory: services/voice-transcoding-service
